{% extends 'base.html' %}
{% block title %}Explorar - Tasty{% endblock %}

{% block content %}
{% include 'partials/navbar.html' %}

<main class="min-h-screen bg-gray-100 py-10 px-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-darker">Encontre seu prato 🤤</h1>
            <a href="{{ url_for('auth.logout') }}" class="text-sm font-bold text-red-500 hover:text-red-700">Sair</a>
        </header>

        <div class="flex justify-center">
            <div class="relative w-80 h-[500px] bg-white rounded-[2rem] shadow-xl overflow-hidden border border-gray-200">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&q=80&w=1000" class="w-full h-3/4 object-cover" alt="Pizza">
                <div class="p-6 bg-gradient-to-t from-black/80 to-transparent absolute bottom-0 w-full text-white">
                    <h2 class="text-2xl font-bold">Pizza da Mamma 🍕</h2>
                    <p class="text-sm opacity-90">Pizzaria • A 2km de você</p>
                </div>
            </div>
        </div>

        <div class="flex gap-6 justify-center mt-8">
            <button class="w-16 h-16 rounded-full bg-white text-red-500 shadow-lg text-3xl font-bold flex items-center justify-center hover:bg-red-50 hover:scale-110 transition-all">✕</button>
            <button class="w-16 h-16 rounded-full bg-primary text-white shadow-lg shadow-primary/30 text-3xl flex items-center justify-center hover:bg-primary-dark hover:scale-110 transition-all">♥</button>
        </div>
    </div>
</main>
{% endblock %}
